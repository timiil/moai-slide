<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Moai Slide 20</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17130f;color:#f6e7c3;font-family:system-ui,-apple-system,sans-serif;overscroll-behavior:none}.app{height:100%;display:flex;flex-direction:column;max-width:980px;margin:auto;padding:8px 12px}.top{display:flex;justify-content:space-between;align-items:center;min-height:52px;gap:8px}.brand{font-weight:900;color:#ffe1a0}.sub{font-size:12px;opacity:.75}.stats{display:flex;gap:6px}.pill{border:1px solid #70593b;background:#211a14;border-radius:999px;padding:6px 10px;font-size:13px}.boardWrap{flex:1;display:grid;place-items:center;min-height:0}.board{position:relative;width:min(82vw,70vh,610px);aspect-ratio:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);border:7px solid #392b20;border-radius:16px;background:#8f7449;box-shadow:0 16px 38px #0008;overflow:hidden;touch-action:none;user-select:none}.cell{position:relative;border:1px solid #735c3b;background:linear-gradient(135deg,#b3925c,#a78652)}.wall{background:linear-gradient(145deg,#4a3b2e,#32271f)}.goal:after{content:attr(data-id);position:absolute;inset:20%;border:3px dashed #f2cc79aa;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#6d4e20}.pillar:after{content:"";position:absolute;inset:13%;background:linear-gradient(90deg,#6d5c49,#4a3e33);border-radius:10px;box-shadow:inset -7px 0 #0002,0 5px 4px #0004}.statue{position:absolute;width:calc(100% / 7 * .82);height:calc(100% / 7 * .92);z-index:10;transition:left .24s,top .24s,transform .14s;filter:drop-shadow(0 5px 2px #0005);display:grid;place-items:center;touch-action:none}.moai{width:76%;height:92%;border-radius:45% 45% 27% 27%/30% 30% 16% 16%;background:linear-gradient(90deg,#657680,#8799a1 45%,#566873);position:relative;box-shadow:inset -7px 0 #0002,inset 4px 0 #fff1;pointer-events:none}.b .moai{background:linear-gradient(90deg,#835947,#a97760 45%,#6f4b3d)}.c .moai{background:linear-gradient(90deg,#4f765e,#75a77f 45%,#40654e)}.moai:before{content:"";position:absolute;left:19%;right:18%;top:31%;height:16%;border-top:5px solid #302a27;border-bottom:3px solid #302a27;clip-path:polygon(0 0,100% 0,78% 100%,22% 100%)}.moai:after{content:"";position:absolute;left:31%;right:27%;bottom:19%;height:9%;border-bottom:4px solid #302a27}.sig{position:absolute;top:3%;font-size:12px;font-weight:1000;color:white;pointer-events:none}.selected{transform:scale(1.09);filter:drop-shadow(0 0 8px #ffd77a)}.goalhit .moai{filter:brightness(1.25);box-shadow:0 0 16px #ffd97d}.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:116px}.actions,.levels{display:flex;gap:6px;flex-wrap:wrap}.levels{justify-content:flex-end;max-height:84px;overflow:auto}.btn{border:1px solid #765f40;background:#2c231a;color:#f9e8c1;border-radius:11px;padding:9px 11px;font-weight:750;font-size:13px;touch-action:manipulation}.levelBtn{width:38px;padding:8px 0}.active{border-color:#e2b85f;color:#ffe29b;background:#45351f}.dpad{display:grid;grid-template-columns:46px 46px 46px;grid-template-rows:40px 40px 40px;gap:4px}.dir{font-size:21px;padding:0}.up{grid-column:2}.left{grid-column:1;grid-row:2}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}.message{position:absolute;left:50%;top:62px;transform:translate(-50%,-10px);z-index:30;background:#19130eee;border:1px solid #8b7048;border-radius:14px;padding:10px 14px;opacity:0;pointer-events:none;transition:.18s;max-width:85%;text-align:center;font-weight:700}.message.show{opacity:1;transform:translate(-50%,0)}.win{position:absolute;inset:0;z-index:50;background:#120e0bd9;display:none;place-items:center;padding:20px}.win.show{display:grid}.card{background:#2a2118;border:1px solid #8c7048;border-radius:20px;padding:24px;text-align:center;max-width:360px}.stars{font-size:34px;color:#f1c55f}@media(orientation:portrait){.levels{flex-wrap:nowrap;overflow-x:auto;max-height:none;justify-content:flex-start}.controls{grid-template-columns:1fr auto;grid-template-areas:'actions dpad' 'levels levels';min-height:150px}.actions{grid-area:actions}.dpad{grid-area:dpad}.levels{grid-area:levels}}@media(orientation:landscape) and (max-height:620px){.top{min-height:38px}.board{width:min(72vh,54vw,500px)}.controls{position:absolute;right:10px;bottom:8px;display:block;min-height:0;width:190px}.actions,.levels{justify-content:center;margin:4px}.levels{max-height:68px}.dpad{margin:auto}.sub{display:none}}</style></head><body><div class="app"><div class="top"><div><div class="brand">MOAI · SLIDE 20</div><div class="sub" id="subtitle"></div></div><div class="stats"><div class="pill">步数 <b id="moves">0</b></div><div class="pill">PAR <b id="par">0</b></div></div></div><div class="boardWrap"><div class="board" id="board"></div></div><div class="controls"><div class="actions"><button class="btn" id="undo">↶ 撤销</button><button class="btn" id="restart">↻ 重开</button><button class="btn" id="hint">提示</button></div><div class="dpad"><button class="btn dir up" data-dir="U">↑</button><button class="btn dir left" data-dir="L">←</button><button class="btn dir right" data-dir="R">→</button><button class="btn dir down" data-dir="D">↓</button></div><div class="levels" id="levels"></div></div><div class="message" id="message"></div><div class="win" id="win"><div class="card"><h2>岛屿恢复了平衡</h2><div class="stars" id="stars">★★★</div><p id="winText"></p><button class="btn" id="next">下一关</button></div></div></div><script>const levels=[{"name":"第1关 · 第一次滑行 · 教学","par":2,"pillars":[[6,5]],"statues":[{"id":"A","x":2,"y":5,"gx":5,"gy":2,"type":"a"}],"hints":["先观察哪些墙、石柱或摩艾能成为停车点。","开头可尝试：AR，AU","最短解：AR AU"]},{"name":"第2关 · 互相刹车 · 教学","par":7,"pillars":[],"statues":[{"id":"A","x":4,"y":5,"gx":2,"gy":6,"type":"a"},{"id":"B","x":2,"y":5,"gx":4,"gy":2,"type":"b"}],"hints":["摩艾也可以成为另一尊摩艾的墙。","开头可尝试：AL，AD","最短解：AL AD BR BD BL AL BU"]},{"name":"第3关 · 石阵","par":3,"pillars":[[3,2]],"statues":[{"id":"A","x":2,"y":2,"gx":6,"gy":2,"type":"a"}],"hints":["先观察停车点。","开头可尝试：AD，AR","最短解：AD AR AU"]},{"name":"第4关 · 石阵","par":4,"pillars":[[3,6]],"statues":[{"id":"A","x":2,"y":6,"gx":4,"gy":6,"type":"a"}],"hints":["先观察停车点。","开头可尝试：AU，AR","最短解：AU AR AD AL"]},{"name":"第5关 · 石阵","par":5,"pillars":[[3,2],[6,5]],"statues":[{"id":"A","x":5,"y":2,"gx":4,"gy":6,"type":"a"},{"id":"B","x":6,"y":4,"gx":6,"gy":6,"type":"b"}],"hints":["先观察停车点。","开头可尝试：AL，BL","最短解：AL BL BD BR AD"]},{"name":"第6关 · 石阵","par":6,"pillars":[[6,6]],"statues":[{"id":"A","x":4,"y":5,"gx":3,"gy":6,"type":"a"},{"id":"B","x":5,"y":4,"gx":6,"gy":2,"type":"b"}],"hints":["先观察停车点。","开头可尝试：AU，BL","最短解：AU BL BU AL AD BR"]},{"name":"第7关 · 石阵","par":7,"pillars":[[4,4],[5,2]],"statues":[{"id":"A","x":3,"y":2,"gx":6,"gy":3,"type":"a"},{"id":"B","x":4,"y":5,"gx":5,"gy":3,"type":"b"}],"hints":["先观察停车点。","开头可尝试：AL，BL","最短解：AL BL BU AR AD AR BR"]},{"name":"第8关 · 石阵","par":7,"pillars":[[4,4]],"statues":[{"id":"A","x":5,"y":6,"gx":6,"gy":5,"type":"a"},{"id":"B","x":6,"y":3,"gx":6,"gy":2,"type":"b"}],"hints":["先观察停车点。","开头可尝试：AU，AR","最短解：AU AR BD AD AL BU AR"]},{"name":"第9关 · 石阵","par":8,"pillars":[[2,3],[6,4]],"statues":[{"id":"A","x":4,"y":5,"gx":6,"gy":3,"type":"a"},{"id":"B","x":3,"y":5,"gx":5,"gy":3,"type":"b"}],"hints":["先观察停车点。","开头可尝试：BU，BR","最短解：BU BR AU BD AR BL AD BR"]},{"name":"第10关 · 石阵","par":8,"pillars":[[4,3]],"statues":[{"id":"A","x":2,"y":5,"gx":4,"gy":6,"type":"a"},{"id":"B","x":6,"y":5,"gx":6,"gy":6,"type":"b"}],"hints":["先观察停车点。","开头可尝试：BL，AD","最短解：BL AD AR BD AL AU BR AD"]},{"name":"第11关 · 石阵","par":9,"pillars":[[6,4]],"statues":[{"id":"A","x":5,"y":6,"gx":3,"gy":5,"type":"a"},{"id":"B","x":2,"y":6,"gx":6,"gy":3,"type":"b"}],"hints":["先观察停车点。","开头可尝试：BU，AL","最短解：BU AL BD AR AU AL BU BR BD"]},{"name":"第12关 · 石阵","par":9,"pillars":[[4,4],[4,6]],"statues":[{"id":"A","x":3,"y":6,"gx":3,"gy":4,"type":"a"},{"id":"B","x":4,"y":2,"gx":6,"gy":5,"type":"b"}],"hints":["先观察停车点。","开头可尝试：AL，BD","最短解：AL BD BL AU AR BD BR BU BR"]},{"name":"第13关 · 三碑","par":10,"pillars":[],"statues":[{"id":"A","x":6,"y":6,"gx":5,"gy":2,"type":"a"},{"id":"B","x":2,"y":6,"gx":6,"gy":4,"type":"b"},{"id":"C","x":4,"y":6,"gx":2,"gy":3,"type":"c"}],"hints":["三尊摩艾会互相改变停车点。","开头可尝试：AU，CU","最短解：AU CU AL BR CD CR CU CR BU CL"]},{"name":"第14关 · 三碑石阵","par":10,"pillars":[[3,4],[4,2]],"statues":[{"id":"A","x":2,"y":5,"gx":5,"gy":5,"type":"a"},{"id":"B","x":6,"y":2,"gx":5,"gy":6,"type":"b"},{"id":"C","x":5,"y":3,"gx":4,"gy":5,"type":"c"}],"hints":["先借一尊摩艾制造停车点。","注意不要过早归位。","可多用撤销探索。"]},{"name":"第15关 · 三碑石阵","par":11,"pillars":[[2,4]],"statues":[{"id":"A","x":3,"y":5,"gx":6,"gy":6,"type":"a"},{"id":"B","x":6,"y":5,"gx":3,"gy":2,"type":"b"},{"id":"C","x":4,"y":3,"gx":5,"gy":5,"type":"c"}],"hints":["先布置挡板再归位。","三碑顺序比路径重要。","可多用撤销探索。"]},{"name":"第16关 · 三碑石阵","par":11,"pillars":[[5,4],[3,6]],"statues":[{"id":"A","x":6,"y":2,"gx":2,"gy":3,"type":"a"},{"id":"B","x":2,"y":5,"gx":6,"gy":6,"type":"b"},{"id":"C","x":4,"y":5,"gx":3,"gy":2,"type":"c"}],"hints":["某些目标必须靠另一尊摩艾精准刹车。","不要把每尊摩艾独立思考。","可多用撤销探索。"]},{"name":"第17关 · 三碑石阵","par":12,"pillars":[[4,4]],"statues":[{"id":"A","x":2,"y":6,"gx":5,"gy":2,"type":"a"},{"id":"B","x":6,"y":6,"gx":2,"gy":5,"type":"b"},{"id":"C","x":3,"y":3,"gx":6,"gy":3,"type":"c"}],"hints":["先构造中间停车点。","归位后的摩艾仍然可以移动。","可多用撤销探索。"]},{"name":"第18关 · 三碑石阵","par":12,"pillars":[[2,3],[5,5]],"statues":[{"id":"A","x":6,"y":4,"gx":3,"gy":6,"type":"a"},{"id":"B","x":3,"y":2,"gx":6,"gy":2,"type":"b"},{"id":"C","x":4,"y":6,"gx":2,"gy":4,"type":"c"}],"hints":["先看谁最适合成为挡板。","中途可能要把已接近终点的摩艾移开。","可多用撤销探索。"]},{"name":"第19关 · 三碑石阵","par":13,"pillars":[[3,3],[5,4]],"statues":[{"id":"A","x":2,"y":5,"gx":6,"gy":5,"type":"a"},{"id":"B","x":6,"y":2,"gx":4,"gy":6,"type":"b"},{"id":"C","x":4,"y":5,"gx":2,"gy":2,"type":"c"}],"hints":["关键是先让某尊摩艾停在非目标位置。","观察每一步之后新的可停车格。","可多用撤销探索。"]},{"name":"第20关 · 终局石阵","par":14,"pillars":[[4,3],[2,5],[6,5]],"statues":[{"id":"A","x":3,"y":6,"gx":6,"gy":2,"type":"a"},{"id":"B","x":5,"y":6,"gx":2,"gy":2,"type":"b"},{"id":"C","x":4,"y":2,"gx":4,"gy":6,"type":"c"}],"hints":["这是综合关：墙、石柱、三碑互相制动。","不要急着完成任何单一摩艾。","把整张棋盘当成动态机器。"]}];let levelIndex=0,state=null,selected='A',history=[],hintIndex=0;const board=document.getElementById('board'),subtitle=document.getElementById('subtitle'),movesEl=document.getElementById('moves'),parEl=document.getElementById('par'),msg=document.getElementById('message'),win=document.getElementById('win'),levelsEl=document.getElementById('levels');function clone(x){return JSON.parse(JSON.stringify(x))}function loadLevel(i){levelIndex=i;const l=levels[i];state={moves:0,statues:clone(l.statues)};selected=l.statues[0].id;history=[];hintIndex=0;subtitle.textContent=l.name;parEl.textContent=l.par;win.classList.remove('show');renderLevels();render()}function renderLevels(){levelsEl.innerHTML='';levels.forEach((_,i)=>{const b=document.createElement('button');b.className='btn levelBtn'+(i===levelIndex?' active':'');b.textContent=i+1;b.onclick=()=>loadLevel(i);levelsEl.appendChild(b)})}function occupied(x,y,ignore){return state.statues.find(s=>s.id!==ignore&&s.x===x&&s.y===y)}function blocked(x,y,ignore){if(x<1||x>7||y<1||y>7)return true;if(x===1||x===7||y===1||y===7)return true;if(levels[levelIndex].pillars.some(p=>p[0]===x&&p[1]===y))return true;return !!occupied(x,y,ignore)}function move(id,d){const s=state.statues.find(q=>q.id===id);if(!s)return;let dx=0,dy=0;if(d==='L')dx=-1;if(d==='R')dx=1;if(d==='U')dy=-1;if(d==='D')dy=1;let x=s.x,y=s.y;while(!blocked(x+dx,y+dy,id)){x+=dx;y+=dy}if(x===s.x&&y===s.y)return;history.push(clone(state));s.x=x;s.y=y;state.moves++;render();checkWin()}function render(){board.innerHTML='';for(let y=1;y<=7;y++)for(let x=1;x<=7;x++){const c=document.createElement('div');c.className='cell'+((x===1||x===7||y===1||y===7)?' wall':'');const g=state.statues.find(s=>s.gx===x&&s.gy===y);if(g){c.classList.add('goal');c.dataset.id=g.id}if(levels[levelIndex].pillars.some(p=>p[0]===x&&p[1]===y))c.classList.add('pillar');board.appendChild(c)}state.statues.forEach(s=>{const d=document.createElement('div');d.className='statue '+s.type+(s.id===selected?' selected':'')+(s.x===s.gx&&s.y===s.gy?' goalhit':'');d.dataset.id=s.id;d.style.left=((s.x-1)/7*100+(1/7*9))+'%';d.style.top=((s.y-1)/7*100+(1/7*4))+'%';d.innerHTML='<div class="moai"></div><div class="sig">'+s.id+'</div>';d.onpointerdown=e=>{selected=s.id;e.stopPropagation();render()};board.appendChild(d)});movesEl.textContent=state.moves}function checkWin(){if(state.statues.every(s=>s.x===s.gx&&s.y===s.gy)){const par=levels[levelIndex].par,n=state.moves;document.getElementById('stars').textContent=n<=par?'★★★':n<=par+3?'★★☆':'★☆☆';document.getElementById('winText').textContent=n+' moves · PAR '+par;setTimeout(()=>win.classList.add('show'),180)}}document.querySelectorAll('.dir').forEach(b=>b.onclick=()=>move(selected,b.dataset.dir));document.getElementById('undo').onclick=()=>{if(history.length){state=history.pop();render()}};document.getElementById('restart').onclick=()=>loadLevel(levelIndex);document.getElementById('hint').onclick=()=>{const hs=levels[levelIndex].hints||[];if(!hs.length)return;msg.textContent=hs[Math.min(hintIndex,hs.length-1)];hintIndex++;msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),2400)};document.getElementById('next').onclick=()=>loadLevel(Math.min(levelIndex+1,levels.length-1));let start=null;board.onpointerdown=e=>{start={x:e.clientX,y:e.clientY,id:e.target.closest('.statue')?.dataset.id||selected};if(start.id)selected=start.id};board.onpointerup=e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.max(Math.abs(dx),Math.abs(dy))>24){move(start.id,Math.abs(dx)>Math.abs(dy)?(dx>0?'R':'L'):(dy>0?'D':'U'))}start=null};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(selected,'L');if(e.key==='ArrowRight')move(selected,'R');if(e.key==='ArrowUp')move(selected,'U');if(e.key==='ArrowDown')move(selected,'D');if(e.key.toLowerCase()==='z')document.getElementById('undo').click();if(e.key.toLowerCase()==='r')document.getElementById('restart').click()});function hardenBoard(){const b=document.getElementById('board');const w=document.querySelector('.boardWrap');if(!b||!w)return;const r=w.getBoundingClientRect();const size=Math.max(180,Math.floor(Math.min(r.width-8,r.height-8,610)));b.style.width=size+'px';b.style.height=size+'px';b.style.aspectRatio='auto'}window.addEventListener('resize',hardenBoard);window.addEventListener('orientationchange',()=>setTimeout(hardenBoard,80));loadLevel(0);setTimeout(hardenBoard,0);</script></body></html>
